[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xpu-flash-attn"
version = "0.1.0"
description = "FlashAttention-compatible interface for Intel XPU via PyTorch SDPA"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["xpu_flash_attn*", "flash_attn*"]
